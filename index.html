<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valois — Perfumes de Lujo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --text: #f5f5f5;
  --muted: #a0a0a0;
  --accent: #c45c26;
  --gold: #e8d5a3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0f0f0f;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  scroll-behavior: smooth;
}
header {
  padding: 1.8rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #2a2a2a;
  position: sticky;
  top: 0;
  background: rgba(15,15,15,0.85);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem;
  letter-spacing: 4px;
  font-weight: 500;
}
.filters {
  padding: 1.4rem 2.5rem;
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
  background: #141414;
  border-bottom: 1px solid #2a2a2a;
  position: sticky;
  top: 78px;
  z-index: 40;
}
.filters input, .filters select {
  padding: 0.7rem 1rem;
  border: 1px solid #333;
  border-radius: 12px;
  background: #1e1e1e;
  color: #fff;
  font-size: 0.9rem;
  min-width: 160px;
  outline: none;
}
.filters input:focus, .filters select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(196, 92, 38, 0.4);
}
.hero {
  background: url('https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=2000&h=1000&fit=crop') no-repeat center/cover;
  height: 55vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  position: relative;
  z-index: 1;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: -1;
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  font-weight: 600;
  margin-bottom: 0.8rem;
}
.hero p {
  font-size: 1rem;
  margin-bottom: 1.6rem;
  max-width: 600px;
}
.hero button {
  padding: 1rem 2.5rem;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
}
.hero button:hover {
  background: #b04d20;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2rem;
  padding: 3rem 2.5rem;
  max-width: 1450px;
  margin: 0 auto;
}
.card {
  background: #1a1a1a;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid #2a2a2a;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s forwards;
  position: relative;
  overflow: hidden;
}
.card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.card:hover img {
  transform: scale(1.05);
}
.card-body { padding: 1.3rem 1.4rem 1.5rem; }
.card-body h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 500;
  margin: 0.3rem 0 0.2rem;
}
.meta { font-size: 0.8rem; color: var(--muted); }
.badge {
  display: inline-block;
  background: #2a2a2a;
  color: #ccc;
  font-size: 0.7rem;
  padding: 0.1rem 0.6rem;
  border-radius: 99px;
  margin-right: 0.3rem;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  overflow-y: auto;
}
.modal.open { display: flex; }
.modal-content {
  background: #1a1a1a;
  border-radius: 24px;
  max-width: 860px;
  width: 100%;
  max-height: 90vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  border: 1px solid #333;
  position: relative;
  animation: modalIn 0.35s ease;
}
.modal-img {
  background: #161616;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.modal-img img { width: 100%; height: 100%; object-fit: contain; }
.modal-info { padding: 2rem 1.8rem; overflow-y: auto; }
.modal-info h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 500;
  margin-bottom: 0.7rem;
}
.notes { margin-top: 1.2rem; font-size: 0.9rem; line-height: 1.6; color: #ddd; }
.notes strong {
  display: block;
  margin-top: 0.9rem;
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--gold);
}
.close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: #2a2a2a;
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
  transition: all 0.3s ease;
}
.close:hover {
  background: #3a3a3a;
  transform: scale(1.1);
}
footer {
  border-top: 1px solid #2a2a2a;
  padding: 2.5rem 1rem;
  text-align: center;
  color: #777;
  font-size: 0.8rem;
  margin-top: 3rem;
}
footer strong { color: var(--gold); letter-spacing: 1px; }
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
@media (max-width: 720px) {
  .modal-content { grid-template-columns: 1fr; }
  .filters { padding: 1rem; }
  .grid { padding: 1.2rem; }
}
</style>
</head>
<body>
<header>
  <div class="logo">VALOIS</div>
  <span id="count" style="font-size:0.82rem; color:#888;"></span>
</header>
<div class="hero">
  <h1>Descubre Nuestros Perfumes Premium</h1>
  <p>Calidad superior en cada aroma.</p>
  <button onclick="scrollToFilters()">Ver Perfumes</button>
</div>
<div class="filters" id="filters">
  <input type="text" id="search" placeholder="Buscar perfume o marca…">
  <select id="filterGenero"><option value="">Todos los géneros</option></select>
  <select id="filterConc"><option value="">Todas las concentraciones</option></select>
  <select id="filterMarca"><option value="">Todas las marcas</option></select>
</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">×</button>
  <div class="modal-content" id="modalContent"></div>
</div>
<footer>
  Powered by <strong>DUCKY QUACK ESTUDIO</strong>
</footer>
<script>
const samplePerfumes = [
  { nombre: "Sauvage Elixir", marca: "Dior", genero: "Caballero", concentracion: "Elixir", tamano: "60", familia: "Amaderado aromático", salida: "Bergamota, Especias", corazon: "Lavanda, Pimienta", fondo: "Ámbar, Madera", imagen: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500&h=500&fit=crop" },
  { nombre: "Libre Le Parfum", marca: "YSL", genero: "Dama", concentracion: "Parfum", tamano: "90", familia: "Floral oriental", salida: "Mandarina, Lavanda", corazon: "Flor de azahar, Jazmín", fondo: "Vainilla, Ámbar", imagen: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=500&h=500&fit=crop" },
  { nombre: "Acqua di Gio Profondo", marca: "Armani", genero: "Caballero", concentracion: "Eau de Parfum", tamano: "75", familia: "Acuático", salida: "Bergamota, Manzana verde", corazon: "Lavanda, Romero", fondo: "Musgo, Pachulí", imagen: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500&h=500&fit=crop" },
  { nombre: "Chance Eau Tendre", marca: "Chanel", genero: "Dama", concentracion: "Eau de Toilette", tamano: "100", familia: "Floral frutal", salida: "Pomelo, Membrillo", corazon: "Jacinto, Jazmín", fondo: "Musgo, Ámbar", imagen: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500&h=500&fit=crop" }
];
let perfumes = samplePerfumes;
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
function render(list) {
  grid.innerHTML = '';
  countEl.textContent = list.length + ' perfumes';
  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/300x280/1a1a1a/666?text=Perfume'">
      <div class="card-body">
        <div>
          <span class="badge">${p.concentracion}</span>
          <span class="badge">${p.genero}</span>
        </div>
        <h3>${p.nombre}</h3>
        <div class="meta">${p.marca} · ${p.tamano} ml</div>
      </div>
    `;
    card.onclick = () => openModal(p);
    grid.appendChild(card);
  });
}
function openModal(p) {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-img">
      <img src="${p.imagen}" alt="${p.nombre}">
    </div>
    <div class="modal-info">
      <h2>${p.nombre}</h2>
      <p style="color:#aaa; font-size:0.85rem; margin:0.5rem 0 1.2rem;">${p.marca} · ${p.concentracion} · ${p.genero} · ${p.tamano} ml</p>
      <div class="notes">
        <strong>Familia olfativa</strong> ${p.familia}
        <strong>Notas de salida</strong> ${p.salida}
        <strong>Notas de corazón</strong> ${p.corazon}
        <strong>Notas de fondo</strong> ${p.fondo}
      </div>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function unique(arr, key) {
  return [...new Set(arr.map(p => p[key]).filter(Boolean))].sort();
}
function fillSelect(id, options, current, def) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${def}</option>`;
  options.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    el.appendChild(o);
  });
  if (current && options.includes(current)) el.value = current;
  else el.value = '';
}
function updateFilters() {
  const generoSel = document.getElementById('filterGenero').value;
  const concSel = document.getElementById('filterConc').value;
  const marcaSel = document.getElementById('filterMarca').value;
  const q = document.getElementById('search').value.toLowerCase();
  let base = perfumes.filter(p => {
    const t = ((p.nombre||'') + ' ' + (p.marca||'')).toLowerCase();
    return !q || t.includes(q);
  });
  fillSelect('filterGenero', unique(base, 'genero'), generoSel, 'Todos los géneros');
  const genero = document.getElementById('filterGenero').value;
  let afterG = base.filter(p => !genero || p.genero === genero);
  fillSelect('filterConc', unique(afterG, 'concentracion'), concSel, 'Todas las concentraciones');
  const conc = document.getElementById('filterConc').value;
  let afterC = afterG.filter(p => !conc || p.concentracion === conc);
  fillSelect('filterMarca', unique(afterC, 'marca'), marcaSel, 'Todas las marcas');
  const marca = document.getElementById('filterMarca').value;
  render(afterC.filter(p => !marca || p.marca === marca));
}
function loadData() {
  updateFilters();
}
['search','filterGenero','filterConc','filterMarca'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateFilters);
  document.getElementById(id).addEventListener('change', updateFilters);
});
function scrollToFilters() {
  document.getElementById('filters').scrollIntoView({ behavior: 'smooth' });
}
loadData();
</script>
</body>
</html>
