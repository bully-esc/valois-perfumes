    "contents": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Valois — Perfumes</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root {\n  --bg: #0f0f0f;\n  --surface: #1a1a1a;\n  --text: #f5f5f5;\n  --muted: #a0a0a0;\n  --accent: #c45c26;\n  --gold: #e8d5a3;\n}\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody {\n  font-family: 'Inter', system-ui, sans-serif;\n  background: #0f0f0f;\n  color: var(--text);\n  min-height: 100vh;\n}\nheader {\n  padding: 1.4rem 2.5rem;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  border-bottom: 1px solid #2a2a2a;\n  position: sticky;\n  top: 0;\n  background: rgba(15,15,15,0.85);\n  backdrop-filter: blur(12px);\n  z-index: 50;\n}\n.logo {\n  font-family: 'Playfair Display', serif;\n  font-size: 1.7rem;\n  letter-spacing: 4px;\n  font-weight: 500;\n}\n.filters {\n  padding: 1.2rem 2.5rem;\n  display: flex;\n  gap: 0.8rem;\n  flex-wrap: wrap;\n  background: #141414;\n  border-bottom: 1px solid #2a2a2a;\n  position: sticky;\n  top: 68px;\n  z-index: 40;\n}\n.filters input, .filters select {\n  padding: 0.6rem 1rem;\n  border: 1px solid #333;\n  border-radius: 10px;\n  background: #1e1e1e;\n  color: #fff;\n  font-size: 0.88rem;\n  min-width: 160px;\n  outline: none;\n}\n.filters input:focus, .filters select:focus {\n  border-color: var(--accent);\n}\n.grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));\n  gap: 1.8rem;\n  padding: 2.5rem;\n  max-width: 1450px;\n  margin: 0 auto;\n}\n.card {\n  background: #1a1a1a;\n  border-radius: 16px;\n  overflow: hidden;\n  border: 1px solid #2a2a2a;\n  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n  cursor: pointer;\n  opacity: 0;\n  transform: translateY(20px);\n  animation: fadeUp 0.6s forwards;\n}\n.card:hover {\n  transform: translateY(-8px);\n  border-color: #3a3a3a;\n  box-shadow: 0 20px 40px rgba(0,0,0,0.4);\n}\n.card img {\n  width: 100%;\n  height: 280px;\n  object-fit: contain;\n  background: linear-gradient(180deg, #1e1e1e, #161616);\n}\n.card-body { padding: 1.1rem 1.2rem 1.3rem; }\n.card-body h3 {\n  font-family: 'Playfair Display', serif;\n  font-size: 1.05rem;\n  font-weight: 500;\n  margin: 0.3rem 0 0.2rem;\n}\n.meta { font-size: 0.75rem; color: var(--muted); }\n.badge {\n  display: inline-block;\n  background: #2a2a2a;\n  color: #ccc;\n  font-size: 0.65rem;\n  padding: 0.15rem 0.55rem;\n  border-radius: 99px;\n  margin-right: 0.25rem;\n}\n.modal {\n  display: none;\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.75);\n  z-index: 100;\n  align-items: center;\n  justify-content: center;\n  padding: 1rem;\n  backdrop-filter: blur(6px);\n}\n.modal.open { display: flex; }\n.modal-content {\n  background: #1a1a1a;\n  border-radius: 20px;\n  max-width: 860px;\n  width: 100%;\n  max-height: 90vh;\n  overflow: hidden;\n  display: grid;\n  grid-template-columns: 1fr 1.15fr;\n  border: 1px solid #333;\n  position: relative;\n  animation: modalIn 0.35s ease;\n}\n.modal-img {\n  background: #161616;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.modal-img img { width: 100%; height: 100%; object-fit: contain; }\n.modal-info { padding: 2rem 1.8rem; overflow-y: auto; }\n.modal-info h2 {\n  font-family: 'Playfair Display', serif;\n  font-size: 1.6rem;\n  font-weight: 500;\n}\n.notes { margin-top: 1.2rem; font-size: 0.9rem; line-height: 1.6; color: #ddd; }\n.notes strong {\n  display: block;\n  margin-top: 0.9rem;\n  font-weight: 600;\n  font-size: 0.72rem;\n  letter-spacing: 0.6px;\n  text-transform: uppercase;\n  color: var(--gold);\n}\n.close {\n  position: absolute;\n  top: 1rem;\n  right: 1rem;\n  background: #2a2a2a;\n  border: none;\n  width: 38px;\n  height: 38px;\n  border-radius: 50%;\n  color: #fff;\n  font-size: 1.3rem;\n  cursor: pointer;\n}\nfooter {\n  border-top: 1px solid #2a2a2a;\n  padding: 2.5rem 1rem;\n  text-align: center;\n  color: #777;\n  font-size: 0.8rem;\n  margin-top: 3rem;\n}\nfooter strong { color: var(--gold); letter-spacing: 1px; }\n@keyframes fadeUp {\n  to { opacity: 1; transform: translateY(0); }\n}\n@keyframes modalIn {\n  from { opacity: 0; transform: scale(0.96); }\n  to { opacity: 1; transform: scale(1); }\n}\n@media (max-width: 720px) {\n  .modal-content { grid-template-columns: 1fr; }\n  .filters { padding: 1rem; }\n  .grid { padding: 1.2rem; }\n}\n</style>\n</head>\n<body>\n<header>\n  <div class=\"logo\">VALOIS</div>\n  <span id=\"count\" style=\"font-size:0.82rem; color:#888;\"></span>\n</header>\n<div class=\"filters\">\n  <input type=\"text\" id=\"search\" placeholder=\"Buscar perfume o marca…\">\n  <select id=\"filterGenero\"><option value=\"\">Todos los géneros</option></select>\n  <select id=\"filterConc\"><option value=\"\">Todas las concentraciones</option></select>\n  <select id=\"filterMarca\"><option value=\"\">Todas las marcas</option></select>\n</div>\n<div class=\"grid\" id=\"grid\"></div>\n<div class=\"modal\" id=\"modal\">\n  <button class=\"close\" onclick=\"closeModal()">×</button>\n  <div class=\"modal-content\" id=\"modalContent\"></div>\n</div>\n<footer>\n  Powered by <strong>DUCKY QUACK ESTUDIO</strong>\n</footer>\n<script>\nconst samplePerfumes = [\n  { nombre: \"Sauvage Elixir\", marca: \"Dior\", genero: \"Caballero\", concentracion: \"Elixir\", tamano: \"60\", familia: \"Amaderado aromático\", salida: \"Bergamota, Especias\", corazon: \"Lavanda, Pimienta\", fondo: \"Ámbar, Madera\", imagen: \"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500&h=500&fit=crop\" },\n  { nombre: \"Libre Le Parfum\", marca: \"YSL\", genero: \"Dama\", concentracion: \"Parfum\", tamano: \"90\", familia: \"Floral oriental\", salida: \"Mandarina, Lavanda\", corazon: \"Flor de azahar, Jazmín\", fondo: \"Vainilla, Ámbar\", imagen: \"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500&h=500&fit=crop\" },\n  { nombre: \"Acqua di Gio Profondo\", marca: \"Armani\", genero: \"Caballero\", concentracion: \"Eau de Parfum\", tamano: \"75\", familia: \"Acuático\", salida: \"Bergamota, Manzana verde\", corazon: \"Lavanda, Romero\", fondo: \"Musgo, Pachulí\", imagen: \"https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500&h=500&fit=crop\" },\n  { nombre: \"Chance Eau Tendre\", marca: \"Chanel\", genero: \"Dama\", concentracion: \"Eau de Toilette\", tamano: \"100\", familia: \"Floral frutal\", salida: \"Pomelo, Membrillo\", corazon: \"Jacinto, Jazmín\", fondo: \"Musgo, Ámbar\", imagen: \"https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500&h=500&fit=crop\" }\n];\nlet perfumes = samplePerfumes;\nconst grid = document.getElementById('grid');\nconst countEl = document.getElementById('count');\nfunction render(list) {\n  grid.innerHTML = '';\n  countEl.textContent = list.length + ' perfumes';\n  list.forEach((p, i) => {\n    const card = document.createElement('div');\n    card.className = 'card';\n    card.style.animationDelay = (i * 0.06) + 's';\n    card.innerHTML = `\n      <img src=\"${p.imagen}\" alt=\"${p.nombre}\" onerror=\"this.src='https://via.placeholder.com/300x280/1a1a1a/666?text=Perfume'\">\n      <div class=\"card-body\">\n        <div>\n          <span class=\"badge\">${p.concentracion}</span>\n          <span class=\"badge\">${p.genero}</span>\n        </div>\n        <h3>${p.nombre}</h3>\n        <div class=\"meta\">${p.marca} · ${p.tamano} ml</div>\n      </div>\n    `;\n    card.onclick = () => openModal(p);\n    grid.appendChild(card);\n  });\n}\nfunction openModal(p) {\n  document.getElementById('modalContent').innerHTML = `\n    <div class=\"modal-img\">\n      <img src=\"${p.imagen}\" alt=\"${p.nombre}\">\n    </div>\n    <div class=\"modal-info\">\n      <h2>${p.nombre}</h2>\n      <p style=\"color:#aaa; font-size:0.85rem; margin:0.5rem 0 1.2rem;\">${p.marca} · ${p.concentracion} · ${p.genero} · ${p.tamano} ml</p>\n      <div class=\"notes\">\n        <strong>Familia olfativa</strong> ${p.familia}\n        <strong>Notas de salida</strong> ${p.salida}\n        <strong>Notas de corazón</strong> ${p.corazon}\n        <strong>Notas de fondo</strong> ${p.fondo}\n      </div>\n    </div>\n  `;\n  document.getElementById('modal').classList.add('open');\n}\nfunction closeModal() { document.getElementById('modal').classList.remove('open'); }\ndocument.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };\nfunction unique(arr, key) {\n  return [...new Set(arr.map(p => p[key]).filter(Boolean))].sort();\n}\nfunction fillSelect(id, options, current, def) {\n  const el = document.getElementById(id);\n  el.innerHTML = `<option value=\"\">${def}</option>`;\n  options.forEach(v => {\n    const o = document.createElement('option');\n    o.value = v; o.textContent = v;\n    el.appendChild(o);\n  });\n  if (current && options.includes(current)) el.value = current;\n  else el.value = '';\n}\nfunction updateFilters() {\n  const generoSel = document.getElementById('filterGenero').value;\n  const concSel = document.getElementById('filterConc').value;\n  const marcaSel = document.getElementById('filterMarca').value;\n  const q = document.getElementById('search').value.toLowerCase();\n  let base = perfumes.filter(p => {\n    const t = ((p.nombre||'') + ' ' + (p.marca||'')).toLowerCase();\n    return !q || t.includes(q);\n  });\n  fillSelect('filterGenero', unique(base, 'genero'), generoSel, 'Todos los géneros');\n  const genero = document.getElementById('filterGenero').value;\n  let afterG = base.filter(p => !genero || p.genero === genero);\n  fillSelect('filterConc', unique(afterG, 'concentracion'), concSel, 'Todas las concentraciones');\n  const conc = document.getElementById('filterConc').value;\n  let afterC = afterG.filter(p => !conc || p.concentracion === conc);\n  fillSelect('filterMarca', unique(afterC, 'marca'), marcaSel, 'Todas las marcas');\n  const marca = document.getElementById('filterMarca').value;\n  render(afterC.filter(p => !marca || p.marca === marca));\n}\nfunction loadData() {\n  updateFilters();\n}\n['search','filterGenero','filterConc','filterMarca'].forEach(id => {\n  document.getElementById(id).addEventListener('input', updateFilters);\n  document.getElementById(id).addEventListener('change', updateFilters);\n});\nloadData();\n</script>\n</body>\n</html>"
